<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Lo quieres, te lo vendo</title>
    <!-- CDN Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- Menú Navbar de Bootstrap -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="index2.html">Lo quieres, te lo vendo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index2.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="index2.html#productos">Productos</a></li>
                <li class="nav-item"><a class="nav-link active" href="contacto2.html">Contacto</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Formulario Estilizado -->
<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <h2 class="text-center mb-4">Formulario de Contacto</h2>

            <form action="#" method="POST" class="border p-4 rounded shadow-sm bg-light">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico:</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje o consulta:</label>
                    <textarea id="mensaje" name="mensaje" class="form-control" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">Enviar mensaje</button>

            </form>
        </div>
    </div>
</main>

<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2026 - Nombre del Equipo</p>
</footer>

<!-- CDN Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
