<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Agrega esto en el <head> (reemplazando el CSS de Bootstrap) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Iconos de Google para Materialize -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Agrega esto justo antes de </body> (reemplazando el JS de Bootstrap) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Lo quieres, te lo vendo</title>

</head>
<body>

<nav class="blue">
    <div class="nav-wrapper container">
        <a href="#" class="brand-logo">Lo quieres, te lo vendo</a>
        <ul id="nav-mobile" class="right hide-on-med-and-down">
            <li><a href="index2.html">Inicio</a></li>
            <li><a href="#productos">Productos</a></li>
            <li><a href="contacto2.html">Contacto</a></li>
        </ul>
    </div>
</nav>

<main class="container my-5 text-center">
    <section id="extracto">
        <div class="container my-5">
            <h2 class="center-align">Formulario de Contacto</h2>
            <div class="row">
                <form class="col s12 m8 offset-m2">

                    <div class="input-field col s12">
                        <i class="material-icons prefix">account_circle</i>
                        <input id="nombre" type="text" class="validate" required>
                        <label for="nombre">Nombre Completo</label>
                    </div>

                    <div class="input-field col s12">
                        <i class="material-icons prefix">email</i>
                        <input id="email" type="email" class="validate" required>
                        <label for="email">Correo Electrónico</label>
                    </div>

                    <div class="input-field col s12">
                        <i class="material-icons prefix">mode_edit</i>
                        <textarea id="mensaje" class="materialize-textarea" required></textarea>
                        <label for="mensaje">Mensaje o Consulta</label>
                    </div>

                    <button class="btn waves-effect waves-light blue" type="submit">Enviar
                        <i class="material-icons right">send</i>
                    </button>

                </form>
            </div>
        </div>
    </section>

</main>
<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2026 - Nombre del Equipo</p>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
